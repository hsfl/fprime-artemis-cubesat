# Linux native_sim: real flight components/kernel and virtual peripherals.
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_STD_CPP14=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=n
CONFIG_DYNAMIC_THREAD_PREFER_POOL=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
CONFIG_DYNAMIC_THREAD_POOL_SIZE=20
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_REBOOT=y
CONFIG_ASSERT=y
CONFIG_RING_BUFFER=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_I2C=y
CONFIG_EMUL=y
CONFIG_ADC=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_FILE_SYSTEM=y
CONFIG_ENTROPY_GENERATOR=y
