<text x="600.0" y="41.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202a33">System architecture</text>
<text x="600.0" y="78.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#202a33">Teensy owns spacecraft authority; Pi serves the mission payload.</text>
<text x="152.5" y="201.725" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">Yamcs ground</text>
<text x="152.5" y="227.975" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">RF bridge</text>
<text x="620.0" y="188.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">Teensy 4.1 / Zephyr</text>
<text x="620.0" y="214.85" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">MissionApp + bus services</text>
<text x="620.0" y="241.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">Hardware watchdog</text>
<text x="1047.5" y="188.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">Pi Zero W / Linux</text>
<text x="1047.5" y="214.85" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">Payload software</text>
<text x="1047.5" y="241.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">Software heartbeat</text>
<text x="152.5" y="499.225" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">Bus sensors</text>
<text x="152.5" y="525.475" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">GPS / IMU / thermal</text>
<text x="620.0" y="486.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">PDU</text>
<text x="620.0" y="512.35" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">Power + actuation</text>
<text x="620.0" y="538.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">Hardware watchdogs</text>
<text x="907.5" y="369.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#202a33">OBC U2</text>
<text x="907.5" y="394.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#202a33">Pi load switch</text>
<text x="1047.5" y="499.225" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">One logical payload</text>
<text x="1047.5" y="525.475" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">Mission hardware</text>
<text x="375.0" y="174.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#202a33">RF command / TM</text>
<text x="845.0" y="175.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#202a33">UART link</text>
<text x="420.0" y="371.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#202a33">Sensor I/O</text>
<text x="725.0" y="352.55" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#202a33">PDU commands</text>
<text x="725.0" y="375.05" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#202a33">and status</text>
<text x="1128.0" y="352.55" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#202a33">Payload</text>
<text x="1128.0" y="375.05" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#202a33">data / control</text>
<text x="846.0" y="541.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#202a33">Switched power</text>
<text x="867.5" y="455.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#202a33">BUS_5V</text>
<text x="857.5" y="292.55" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#202a33">Pin 36</text>
<text x="857.5" y="315.05" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#202a33">RPI_ENABLE</text>
<text x="975.0" y="303.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#202a33">Pi 5 V</text>
<text x="600.0" y="642.275" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#202a33">Blue: logical data/control. Red: power. PDU BUS_5V feeds the OBC Pi load switch.</text>
<text x="600.0" y="666.025" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#202a33">Exact as-built rails, harnesses and reset paths require hardware verification.</text>
</svg>