<text x="600.0" y="41.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202a33">Core topology</text>
<text x="600.0" y="78.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#202a33">Functional groups organize reusable services around one mission application.</text>
<text x="600.0" y="133.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">Mission</text>
<text x="600.0" y="159.85" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">MissionApp</text>
<text x="600.0" y="186.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">Bus modes + student activities</text>
<text x="205.0" y="355.475" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">PowerThermal</text>
<text x="205.0" y="381.725" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">EpsManager: PDU + Pi switch</text>
<text x="205.0" y="407.975" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">ThermalManager</text>
<text x="205.0" y="434.225" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">DeploymentManager</text>
<text x="600.0" y="355.475" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">AttitudeNavigation</text>
<text x="600.0" y="381.725" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">AdcsManager / GpsManager</text>
<text x="600.0" y="407.975" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">Sensor managers</text>
<text x="600.0" y="434.225" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">TimeCoordinator</text>
<text x="995.0" y="355.475" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">GroundLink</text>
<text x="995.0" y="381.725" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">CommsManager / ComQueue</text>
<text x="995.0" y="407.975" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">RadioManager / CCSDS</text>
<text x="995.0" y="434.225" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202a33">SPI / GPIO drivers</text>
<text x="402.5" y="609.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#202a33">CoreServices: CdhCore / Health / FaultManager</text>
<text x="402.5" y="634.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#202a33">Rate groups / parameters / time service / watchdog driver</text>
<text x="402.5" y="659.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#202a33">Shared UART, SPI, I2C and GPIO drivers: one owner per interface</text>
<text x="995.0" y="609.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#202a33">CompanionLink</text>
<text x="995.0" y="634.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#202a33">PiSupervisor + peer transport</text>
<text x="995.0" y="659.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#202a33">Pi jobs / results / heartbeat</text>
<text x="595.0" y="517.275" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#202a33">Shared-service and protective connections are omitted here for clarity (Sections 3 and 10).</text>
<text x="595.0" y="541.025" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#202a33">FaultManager requests Safe and bounded protection; PiSupervisor requests EPS recovery.</text>
