<rect x="35" y="470" width="320" height="125" rx="14" fill="#e9f4eb" stroke="#477a51" stroke-width="2"/>
<rect x="440" y="470" width="320" height="125" rx="14" fill="#e9f4eb" stroke="#477a51" stroke-width="2"/>
