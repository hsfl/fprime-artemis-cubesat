<svg width="1760" height="560" viewBox="0 0 1760 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 28px "Helvetica Neue", Arial, sans-serif; fill: #152033; }
      .subtitle { font: 500 14px "Helvetica Neue", Arial, sans-serif; fill: #55627a; }
      .label { font: 700 15px "Helvetica Neue", Arial, sans-serif; fill: #152033; }
      .body { font: 500 12px "Helvetica Neue", Arial, sans-serif; fill: #32415c; }
      .edge { stroke: #51617d; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10V0Z" fill="#51617d"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1760" height="560" rx="28"/>
  <text class="title" x="72" y="72">Demo Flow</text>
  <text class="subtitle" x="72" y="102">Operator-facing MVP sequence from boot to science review</text>

  <rect x="50" y="190" width="160" height="110" rx="24" fill="#eef6eb" stroke="#4a8a4a" stroke-width="2"/>
  <text class="label" x="74" y="220">1. Boot satellite</text>
  <text class="body" x="74" y="244">Enter Base Mode</text>

  <rect x="235" y="190" width="170" height="110" rx="24" fill="#eaf2ff" stroke="#3c659f" stroke-width="2"/>
  <text class="label" x="259" y="220">2. Set contact</text>
  <text class="body" x="259" y="244">Use D2S2 pass</text>
  <text class="body" x="259" y="262">assumptions</text>

  <rect x="430" y="190" width="180" height="110" rx="24" fill="#eef6eb" stroke="#4a8a4a" stroke-width="2"/>
  <text class="label" x="454" y="220">3. Show SOH</text>
  <text class="body" x="454" y="244">Live telemetry in</text>
  <text class="body" x="454" y="262">fprime-gds</text>

  <rect x="635" y="190" width="190" height="110" rx="24" fill="#eaf2ff" stroke="#3c659f" stroke-width="2"/>
  <text class="label" x="659" y="220">4. Send command</text>
  <text class="body" x="659" y="244">Schedule collection</text>
  <text class="body" x="659" y="262">for example 10 sec</text>

  <rect x="850" y="190" width="190" height="110" rx="24" fill="#eef6eb" stroke="#4a8a4a" stroke-width="2"/>
  <text class="label" x="874" y="220">5. Pending state</text>
  <text class="body" x="874" y="244">MissionApp enters</text>
  <text class="body" x="874" y="262">DataCollectionPending</text>

  <rect x="1065" y="190" width="190" height="110" rx="24" fill="#eef6eb" stroke="#4a8a4a" stroke-width="2"/>
  <text class="label" x="1089" y="220">6. Collect data</text>
  <text class="body" x="1089" y="244">Real or simulated</text>
  <text class="body" x="1089" y="262">science source</text>

  <rect x="1280" y="190" width="180" height="110" rx="24" fill="#eef6eb" stroke="#4a8a4a" stroke-width="2"/>
  <text class="label" x="1304" y="220">7. Package result</text>
  <text class="body" x="1304" y="244">Store or prepare</text>
  <text class="body" x="1304" y="262">science product</text>

  <rect x="1485" y="190" width="180" height="110" rx="24" fill="#eef6eb" stroke="#4a8a4a" stroke-width="2"/>
  <text class="label" x="1509" y="220">8. Downlink science</text>
  <text class="body" x="1509" y="244">ScienceTx mode</text>
  <text class="body" x="1509" y="262">returns payload data</text>

  <rect x="790" y="370" width="220" height="110" rx="24" fill="#eaf2ff" stroke="#3c659f" stroke-width="2"/>
  <text class="label" x="818" y="400">9. Review on ground</text>
  <text class="body" x="818" y="424">Operator presents result</text>
  <text class="body" x="818" y="442">to judges in the demo</text>

  <path class="edge" marker-end="url(#arrow)" d="M210 245H235"/>
  <path class="edge" marker-end="url(#arrow)" d="M405 245H430"/>
  <path class="edge" marker-end="url(#arrow)" d="M610 245H635"/>
  <path class="edge" marker-end="url(#arrow)" d="M825 245H850"/>
  <path class="edge" marker-end="url(#arrow)" d="M1040 245H1065"/>
  <path class="edge" marker-end="url(#arrow)" d="M1255 245H1280"/>
  <path class="edge" marker-end="url(#arrow)" d="M1460 245H1485"/>
  <path class="edge" marker-end="url(#arrow)" d="M1575 300V340C1575 365 1555 385 1530 385H1010"/>

  <text class="body" x="1210" y="340">Final operator-visible outcome</text>
</svg>
